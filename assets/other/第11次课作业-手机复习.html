<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第11次课作业 · 手机复习版</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1f2329; --sub:#606670; --line:#e3e6eb;
    --brand:#2b5fa8; --brand-soft:#eaf1fb; --right:#0a7d3f; --right-bg:#e7f6ed;
    --wrong:#c0392b; --wrong-bg:#fdeceb; --mark:#b7791f; --mark-bg:#fff6e2;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding-bottom:40px;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,#2b5fa8,#4f86c6);color:#fff;padding:20px 16px 18px}
  header h1{margin:0 0 6px;font-size:20px;letter-spacing:.5px}
  header p{margin:0;font-size:13px;opacity:.92}
  .stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    border-radius:10px;padding:6px 11px;font-size:13px}
  .stat b{font-size:16px}
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:5px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mini{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;
    padding:5px 9px;font-size:12px;cursor:pointer}
  #search{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:14px;background:#fff;color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:0 12px}
  .sec-title{margin:22px 2px 10px;font-size:17px;font-weight:700;color:var(--brand)}
  .group{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:6px;
    padding:10px 12px;margin:16px 0 8px;font-size:13px;color:#25477b}
  .group .ctx{margin-top:8px;background:#fff;border-radius:6px;padding:8px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(20,30,50,.04);scroll-margin-top:96px}
  .card.wrong{border-left:4px solid var(--wrong)}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .qnum{font-weight:700;font-size:14px;color:var(--brand)}
  .tag{font-size:11px;border-radius:999px;padding:2px 8px;background:#eef0f3;color:var(--sub)}
  .tag.w{background:var(--wrong-bg);color:var(--wrong)}
  .tag.m{background:var(--mark-bg);color:var(--mark)}
  .star{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:#c7cbd1;padding:2px 6px}
  .star.on{color:var(--mark)}
  .stem{white-space:pre-wrap;word-break:break-word}
  pre{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px 11px;
    overflow-x:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;margin:9px 0}
  .opts{list-style:none;margin:10px 0 8px;padding:0}
  .opt{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0;
    font-size:14.5px;background:#fcfcfd;word-break:break-word}
  .card.revealed .opt.right{background:var(--right-bg);border-color:#9ed4b3;color:var(--right);font-weight:600}
  .card.revealed .opt.bad{background:var(--wrong-bg);border-color:#f0b5ae;color:var(--wrong)}
  .reveal{width:100%;border:1px dashed #c3ccd8;background:#fafbfc;color:var(--brand);
    border-radius:8px;padding:8px;font-size:14px;cursor:pointer;margin-top:4px}
  .ansbox{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  .card.revealed .ansbox{display:block}
  .aline{font-size:14px;background:#f7f8fa;border-radius:7px;padding:7px 9px}
  .aline .g{color:var(--right);font-weight:700}
  .aline .r{color:var(--wrong);font-weight:700}
  .exp{font-size:14px;color:#3a4049;margin-top:8px;white-space:pre-wrap}
  #jump{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 4px}
  #jump button{width:32px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:12px;cursor:pointer;color:var(--sub)}
  #jump button.w{background:var(--wrong-bg);border-color:#f0b5ae;color:var(--wrong);font-weight:700}
  #jump button.h{background:var(--mark-bg);border-color:#ecd7a8;color:var(--mark);font-weight:700}
  footer{max-width:760px;margin:24px auto 0;padding:0 14px;color:var(--sub);font-size:12px}
  .hide{display:none!important}
  @media (max-width:420px){header h1{font-size:18px}.opt{font-size:14px}}
  /* 课件知识卡 */
  #kmap{background:#fff;border-bottom:1px solid var(--line);padding:12px;max-width:784px;margin:0 auto}
  #kmap h2{font-size:16px;margin:0 0 8px;color:var(--brand)}
  #kmap .tip{font-size:12px;color:var(--sub);margin-bottom:10px}
  .kcard{border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fcfcfd;scroll-margin-top:150px}
  .kcard[open]{border-color:#a9c2e3;background:#fff}
  .kcard summary{cursor:pointer;padding:9px 11px;font-size:14px;font-weight:600;color:#25477b}
  .kcard summary span{float:right;font-weight:400;font-size:12px;color:var(--sub)}
  .kbody{padding:0 12px 11px;font-size:13.5px;color:#39404a}
  .kbody ul{margin:6px 0;padding-left:19px}
  .kbody li{margin:4px 0}
  .kbody code{background:#eef1f5;border-radius:4px;padding:1px 4px;font-size:12.5px}
  .kbody .key{background:#fff4d9;border-left:3px solid #e0a92b;padding:6px 9px;margin:8px 0;border-radius:4px}
  .klinks{margin:8px 0 2px;font-size:12px;color:var(--sub)}
  .klink{border:1px solid #cddcf0;background:var(--brand-soft);color:#25477b;border-radius:999px;
    padding:3px 9px;margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
  .flash{animation:fl 1.4s ease}
  @keyframes fl{0%,60%{box-shadow:0 0 0 4px rgba(43,95,168,.28)}100%{box-shadow:none}}
  /* 课件精讲（内嵌讲解稿） */
  #lectureFrame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#f5f6f8;z-index:50}
  body.lecture-mode header,body.lecture-mode .toolbar,body.lecture-mode #kmap,body.lecture-mode #jump,body.lecture-mode main,body.lecture-mode footer{display:none!important}
  #backToQuiz{position:fixed;top:10px;right:12px;z-index:80;background:#fff;border:1px solid #2b5fa8;color:#2b5fa8;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
  .kactions{margin-top:9px}
  .kopen{border:1px solid #cddcf0;background:#eaf1fb;color:#25477b;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>第11次课作业 · 手机复习版</h1>
  <p>程序的链接 · 浙江省高校在线开放课程平台 · 按题号刷，答案默认折叠</p>
  <div class="stats">
    <span class="stat">总题 <b id="stTotal">0</b></span>
    <span class="stat">原题做错 <b id="stWrong">0</b></span>
    <span class="stat">已标记 <b id="stMark">0</b></span>
  </div>
</header>
<div class="toolbar">
  <div class="row">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="wrong">只看错题</button>
    <button class="chip" data-f="marked">已标记</button>
    <input id="search" placeholder="搜关键词，如 符号 / PIC / 重定位">
  </div>
  <div class="row" style="margin-top:7px">
    <button class="mini" id="expandAll">展开全部答案</button>
    <button class="mini" id="collapseAll">收起全部答案</button>
    <button class="mini" id="toggleKmap">课件知识地图</button>
    <button class="mini" id="toggleLecture">课件精讲 108 页</button>
    <button class="mini" id="toTop">回到顶部</button>
  </div>
</div>
<section id="kmap" class="hide">
  <h2>课件知识地图 · 第11次课《程序的链接》</h2>
  <div class="tip">第一讲 P1–38 目标文件格式 ｜ 第二讲 P39–77 符号表与符号解析 ｜ 第三讲 P78–108 重定位与动态链接。题目下方的蓝色按钮可跳回对应知识点。</div>
  <div id="kcards"></div>
</section>
<div id="jump"></div>
<main id="app"></main>
<iframe id="lectureFrame" class="hide" title="第11次课逐页讲解稿"></iframe>
<button id="backToQuiz" class="hide">← 返回刷题</button>
<footer>数据来自「第11次课作业」PDF（学生：郑羽臣）。标记记录保存在本机浏览器，换设备不同步。</footer>

<script>
const DATA = [
// ===== 单选题 32 道 =====
{sec:'单选',key:'S1',n:1,stem:'以下关于使用GCC生成C语言程序的可执行文件的叙述中，错误的是（）',
 opts:['第一步预处理，对#include、#define、#ifdef等预处理命令进行处理','第二步编译，将预处理结果编译转换成二进制形式的汇编语言程序代码','第三步汇编，将汇编语言代码汇编成机器指令表示的机器语言代码','第四步链接，将多个模块的机器语言代码链接生成可执行目标程序文件'],
 ans:'B',mine:'B',score:'2/2',exp:'编译是将预处理结果编译转换成文本形式的汇编语言程序代码，不是二进制形式。'},
{sec:'单选',key:'S2',n:2,stem:'以下有关使用GCC生成C语言程序的可执行文件的叙述中，错误的是（）',
 opts:['预处理的结果还是一个C语言源程序文件，属于可读的文本文件','经过预处理、编译和汇编处理得到的结果是一个可重定位目标文件','每个C语言源程序文件生成一个对应的可重定位目标文件','只要在链接命令中指定所有的相关可重定位目标文件，就能生成可执行目标文件'],

{sec:'单选',key:'S3',n:3,stem:'以下有关链接所带来的好处和不足的叙述中，错误的是（）',
 opts:['使得程序员可以分模块开发程序，有利于提高大规模程序的开发效率','使得公共函数库可以为所有程序共享使用，有利于代码重用和提高效率','使得程序员仅需重新编译修改过的源程序模块，从而节约程序开发时间','使得所生成的可执行目标代码中包含了更多公共库函数代码，所占空间大'],

{sec:'单选',key:'S4',n:4,stem:'以下关于ELF目标文件格式的叙述中，错误的是（）',

{sec:'单选',key:'S5',n:5,stem:'以下关于链接器基本功能的叙述中，错误的是（）',

{sec:'单选',key:'S8',n:8,stem:'以下关于ELF目标文件的节头表的叙述中，错误的是（）',

{sec:'单选',key:'S9',n:9,stem:'以下关于ELF可重定位和可执行两种目标文件格式比较的叙述中，错误的是（）',

{sec:'单选',key:'S10',n:10,stem:'以下关于ELF可执行目标文件的程序头表（段头表）的叙述中，错误的是（）',

{sec:'单选',key:'S11',n:11,stem:'以下关于链接过程中对符号定义的判断中，错误的是（）',

{sec:'单选',key:'S12',n:12,stem:'若x为局部变量，xp、y和z是全局变量，则以下判断中错误的是（）',

{sec:'单选',key:'S13',n:13,stem:'以下有关链接符号类型的叙述中，错误的是（）',

{sec:'单选',key:'S14',n:14,stem:'以下有关ELF目标文件的符号表的叙述中，错误的是（）',

{sec:'单选',key:'S16',n:16,stem:'以下有关强符号和弱符号定义的叙述中，错误的是（）',

{sec:'单选',key:'S17',n:17,stem:'以下有关强符号和弱符号的符号解析的叙述中，错误的是（）',

{sec:'单选',key:'S27',n:27,stem:'main函数代码起始地址 0x8048386，紧跟其后的是按 4 字节边界对齐的 swap 函数。根据代码分析，重定位后的内容为（）',
 code:'// main.c\nextern void swap(void);\nint buf[2] = {1,2};\nint main() {\n    swap();\n    return 0;\n}\n\n// swap.c\nextern int buf[];\nint *bufp0 = &buf[0];\nstatic int *bufp1;\nvoid swap() {\n    int temp;\n    bufp1 = &buf[1];\n    temp = *bufp0;\n    *bufp0 = *bufp1;\n    *bufp1 = temp;\n}\n\n// 选项\nA. 07 00 00 00    B. 00 00 00 07\nC. 0C 00 00 00    D. 00 00 00 0C',
 opts:['07 00 00 00','00 00 00 07','0C 00 00 00','00 00 00 0C'],
 ans:'A',mine:'A',score:'2/2',
 exp:'唯一需重定位的是 call 指令中的 swap 偏移量，r_offset=7，类型 R_386_PC32，初值 init=0xfffffffc（即 -4）。main 占 0x12 字节，swap 起始地址 = 0x8048386+0x12 = 0x8048398。重定位值 = ADDR(swap) − (ADDR(.text)+r_offset−init) = 0x8048398 − (0x8048386+7+4) = 7，故偏移字段为 07 00 00 00。（原题附 .text/.rel.text 示意图，PDF 中未能导出，解析数据完整。）'},

 <li><b>顺序规则</b>：被引用者必须放在引用者<b>右方</b>；<code>.o</code> 要在库左边；相互依赖的库要重复写，如 <code>func.o libx.a liby.a libx.a</code>。</li></ul>

 <li>两种基本类型：<code>R_386_32</code> 绝对地址、<code>R_386_PC32</code> PC 相对地址。</li></ul>

 <li>典型推演：main 起始 <code>0x8048386</code>，call 占位在偏移 7；main 占 <code>0x12</code> 字节，swap 紧跟且 4 字节对齐 → <code>ADDR(swap)=0x8048398</code>。</li>
 <li>结果：<code>0x8048398 − (0x8048386 + 7 + 4) = 7</code>，偏移字段改成 <code>07 00 00 00</code>。</li></ul>
 <div class="key">问"当前 PC 是谁"——答：CALL 指令的下一条指令地址。这是选择题高频陷阱。</div>`},

 <li>例：<code>int buf[2]={10,50}</code> 在 <code>0x8048930</code>；<code>bufp0=&buf[0]</code> 在 swap.o 的 <code>.data</code> 偏移 0，初值 0，重定位条目 <code>R_386_32 buf</code> → 合并后填入 <code>34 89 04 08</code>。</li>
 <li><code>bufp1=&buf[1]</code> 是<b>赋值语句</b>（在代码里），需要在 <code>.rel.text</code> 中对 buf 重定位；不需要对 <code>.data</code> 里的 bufp1 做重定位。</li></ul>
 <div class="key">重定位条目描述的是"哪个位置要改、绑定哪个符号"，不是描述"哪个变量要被改值"。</div>`},

 <li>共享库：Linux <code>.so</code>、Windows <code>.dll</code>，磁盘内存各只有一份；<b>装入时链接</b>（ld-linux.so，libc.so）或<b>运行时链接</b>（dlopen）。</li>
 <li>构建可执行文件的仍是<b>普通链接器</b>；动态链接器只在加载/运行时完成剩余链接。</li>
 <li>共享库代码必须是 <b>PIC 位置无关代码</b>，用 <code>gcc -fPIC</code> 生成；跨模块调用/数据访问用 GOT、PLT 间接寻址。</li></ul>
 <div class="key">共享库升级只要接口（符号）不变，代码长度变化不影响调用它的程序，无需重编链接。</div>`}

const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');
const jump = document.getElementById('jump');
let filter = 'all';
let marks = {};
try { marks = JSON.parse(localStorage.getItem('hw11-marks') || '{}') || {}; } catch(e) { marks = {}; }

function isWrong(q){ return q.ans !== q.mine; }
function cardHTML(q){
  const wrong = isWrong(q);
  const marked = !!marks[q.key];
  const opts = q.opts.map((o,i)=>`<li class="opt ${q.ans===LETTERS[i]?'right':''} ${q.mine===LETTERS[i]&&q.ans!==q.mine?'bad':''}">${LETTERS[i]}. ${o}</li>`).join('');
  const code = q.code ? `<pre>${q.code}</pre>` : '';
  const mineTxt = q.mine === q.ans ? `<span>${q.mine}</span>` : `<span class="r">${q.mine}</span>`;
  return `<article class="card ${wrong?'wrong':''} ${marked?'marked':''}" id="${q.key}" data-wrong="${wrong?'1':''}" data-key="${q.key}">
    <div class="qhead">
      <span class="qnum">${q.sec} ${q.n}</span>
      ${wrong?'<span class="tag w">原题做错</span>':'<span class="tag">已掌握</span>'}
      ${marked?'<span class="tag m">待复习</span>':''}
      <button class="star ${marked?'on':''}" data-key="${q.key}" title="标记待复习">${marked?'★':'☆'}</button>
    </div>
    <div class="stem">${q.stem}</div>
    ${code}
    <ol class="opts">${opts}</ol>
    <div class="klinks">课件对应：${(KMAP[q.key]||[]).map(id=>{const k=KCARDS.find(x=>x.id===id);return `<button class="klink" data-k="${id}">${k.pages} · ${k.title.split('·')[1] ? k.title.split('·')[1].trim() : k.title}</button>`;}).join('')}</div>
    <button class="reveal">显示答案与解析 ▾</button>
    <div class="ansbox">
      <div class="aline">正确答案 <span class="g">${q.ans}</span> ｜ 你的答案 ${mineTxt} ｜ 得分 ${q.score}</div>
      <div class="exp">${q.exp}</div>
    </div>
  </article>`;
}

function render(){
  let html = '', lastSec = '', lastGroup = '';
  DATA.forEach(q=>{
    if (q.sec !== lastSec) {
      html += `<h2 class="sec-title" id="sec-${q.sec}">${q.sec === '完形' ? '完形填空' : q.sec + '题'}</h2>`;
      lastSec = q.sec; lastGroup = '';
    }
    if (q.group && q.group !== lastGroup) {
      html += `<div class="group"><b>${q.group}</b>${q.ctx?`<pre class="ctx">${q.ctx}</pre>`:''}</div>`;
      lastGroup = q.group;
    }
    html += cardHTML(q);
  });
  app.innerHTML = html;

  jump.innerHTML = DATA.map(q=>`<button data-key="${q.key}" class="${isWrong(q)?'w':''} ${marks[q.key]?'h':''}">${q.sec === '单选' ? q.n : q.sec === '判断' ? '判'+q.n : '填'+q.n+'-'+q.key.split('-')[1]}</button>`).join('');

  document.querySelectorAll('.card').forEach(card=>{
    card.querySelector('.reveal').addEventListener('click', e=>{
      card.classList.toggle('revealed');
      e.target.textContent = card.classList.contains('revealed') ? '收起答案 ▴' : '显示答案与解析 ▾';
    });
  });
  document.querySelectorAll('.star').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.key;
      if (marks[k]) delete marks[k]; else marks[k] = 1;
      localStorage.setItem('hw11-marks', JSON.stringify(marks));
      render(); applyFilter();
    });
  });
  document.querySelectorAll('#jump button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (filter !== 'all') { setFilter('all'); }
      document.getElementById(btn.dataset.key)?.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  updateStats();
  applyFilter();
  document.querySelectorAll('.klink').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const box = document.getElementById('kmap');
      if (box.classList.contains('hide')) { box.classList.remove('hide'); document.getElementById('toggleKmap').textContent='收起知识地图'; }
      const card = document.getElementById(btn.dataset.k);
      if (!card) return;
      card.open = true;
      card.scrollIntoView({behavior:'smooth',block:'start'});
      card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    });
  });
}
function updateStats(){
  document.getElementById('stTotal').textContent = DATA.length;
  document.getElementById('stWrong').textContent = DATA.filter(isWrong).length;
  document.getElementById('stMark').textContent = Object.keys(marks).filter(k=>marks[k]).length;
}
function setFilter(f){
  filter = f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.f===f));
  applyFilter();
}
function applyFilter(){
  const kw = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const q = DATA.find(x=>x.key===card.dataset.key);
    const okFilter = filter==='all' || (filter==='wrong'&&isWrong(q)) || (filter==='marked'&&!!marks[q.key]);
    const okKw = !kw || card.textContent.toLowerCase().includes(kw);
    card.classList.toggle('hide', !(okFilter&&okKw));
  });
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>setFilter(c.dataset.f)));
document.getElementById('search').addEventListener('input', applyFilter);
document.getElementById('expandAll').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>{ c.classList.add('revealed'); const b=c.querySelector('.reveal'); if(b) b.textContent='收起答案 ▴'; });
});
document.getElementById('collapseAll').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>{ c.classList.remove('revealed'); const b=c.querySelector('.reveal'); if(b) b.textContent='显示答案与解析 ▾'; });
});
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
function renderKcards(){
  document.getElementById('kcards').innerHTML = KCARDS.map(k=>
    `<details class="kcard" id="${k.id}"><summary>${k.title}<span>${k.pages}</span></summary><div class="kbody">${k.html}<div class="kactions"><button class="kopen" data-pages="${k.pages}">在课件精讲中看原文 →</button></div></div></details>`
  ).join('');
}
renderKcards();
document.getElementById('toggleKmap').addEventListener('click',()=>{
  const box = document.getElementById('kmap');
  const show = box.classList.contains('hide');
  box.classList.toggle('hide', !show);
  document.getElementById('toggleKmap').textContent = show ? '收起知识地图' : '课件知识地图';
  if (show) box.scrollIntoView({behavior:'smooth',block:'start'});
});
render();
</script>

  const frame = document.getElementById('lectureFrame');
  frame.srcdoc = (function(){
    const bin = atob(B64), arr = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(arr);
  })();
  let mode = false;
  function apply(){
    document.body.classList.toggle('lecture-mode', mode);
    document.getElementById('lectureFrame').classList.toggle('hide', !mode);
    document.getElementById('backToQuiz').classList.toggle('hide', !mode);
  }
  function setMode(on){ mode=on; apply(); if(on) window.scrollTo(0,0); }
  document.getElementById('toggleLecture').addEventListener('click', ()=>setMode(true));
  document.getElementById('backToQuiz').addEventListener('click', ()=>setMode(false));
  window.__gotoLecturePages = function(pages){
    const m = String(pages).match(/P\d+/); if(!m) return;
    setMode(true);
    let n = 0;
    const timer = setInterval(()=>{
      const d = frame.contentDocument;
      if (d) {
        const tags = Array.from(d.querySelectorAll('.pgtag'));
        const target = tags.find(x=>x.textContent.trim()===m[0]) || tags.find(x=>x.textContent.trim().indexOf(m[0])===0);
        if (target) { target.scrollIntoView({behavior:'smooth',block:'start'}); clearInterval(timer); return; }
      }
      if (++n > 30) clearInterval(timer);
    }, 200);
  };
  document.querySelectorAll('.kopen').forEach(b=>{
    b.addEventListener('click', ()=>window.__gotoLecturePages(b.dataset.pages));
  });
})();
</script>
