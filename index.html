<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Nico的博客',
      repo: 'nicooccc/my_blog',
      loadSidebar: true,   // 开启侧边栏
      loadNavbar: true,    // 开启顶部导航
      subMaxLevel: 2,      // 侧边栏自动生成文章内目录的层级
      coverpage: true      // 如果写了 _coverpage.md，可以开启封面
}
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
